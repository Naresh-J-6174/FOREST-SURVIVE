# ArcadeHub database settings
# ------------------------------------------------------------------
# LOCAL (Eclipse): leave db.type empty -> MySQL on your own computer.
# Change mysql.user / mysql.password to your MySQL login.
#
# RENDER: set the environment variable MONGODB_URI on Render -> MongoDB Atlas is used
# automatically. Environment variables always override this file.
# (Do NOT write your Atlas password in this file - it goes to GitHub.)
# ------------------------------------------------------------------
db.type=

mysql.url=jdbc:mysql://localhost:3306/arcade_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=root

mongodb.database=arcade_hub
